name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The @notees/* packages are consumed from the vendored monorepo
          # checkout (see README "Syncing the vendored packages").
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --workspace-concurrency=1 build
      - name: Test
        run: pnpm test
